<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোনের বিস্তারিত</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #2b2342; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header-bg {
            background: linear-gradient(180deg, #ff5100 0%, #ff7700 100%);
            padding: 30px 20px 60px;
            text-align: center;
            color: #ffffff;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
        }
        .header-bg h2 {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .header-bg p {
            font-size: 13px;
            opacity: 0.9;
        }
        .content-card {
            margin: -40px 16px 20px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            padding: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        .summary-banner {
            background: linear-gradient(90deg, #ff5e00, #ff2a00);
            border-radius: 14px;
            padding: 18px 10px;
            display: flex;
            justify-content: space-around;
            color: #ffffff;
            text-align: center;
            box-shadow: 0 4px 12px rgba(255, 68, 0, 0.25);
            margin-bottom: 20px;
        }
        .banner-col {
            flex: 1;
            position: relative;
        }
        .banner-col:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background: rgba(255,255,255,0.3);
        }
        .banner-title {
            font-size: 11px;
            opacity: 0.9;
            margin-bottom: 6px;
            display: block;
        }
        .banner-val {
            font-size: 16px;
            font-weight: bold;
        }
        .schedule-box {
            border: 1.5px solid #edf2f7;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 25px;
        }
        .schedule-header {
            padding: 12px 16px;
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1.5px solid #edf2f7;
        }
        .schedule-header i {
            color: #ff5e00;
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
        }
        .schedule-table th {
            background: #f8fafc;
            color: #64748b;
            padding: 10px 14px;
            font-weight: 600;
        }
        .schedule-table td {
            padding: 14px;
            border-top: 1px solid #edf2f7;
            color: #334155;
        }
        .month-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            background: #eff6ff;
            color: #3b82f6;
            border-radius: 50%;
            font-weight: bold;
            font-size: 11px;
        }
        .amount-col {
            color: #dc2626;
            font-weight: bold;
            text-align: right;
        }
        .schedule-table th:last-child {
            text-align: right;
        }
        .footer-action {
            margin-top: auto;
            padding-bottom: 10px;
        }
        .confirm-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #ff6a00, #ff2a00);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 68, 0, 0.35);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bg">
        <h2>লোনের বিস্তারিত</h2>
        <p>তথ্যগুলো যাচাই করুন — সব ঠিক থাকলে এগিয়ে যান</p>
    </div>

    <div class="content-card">
        <div class="summary-banner">
            <div class="banner-col">
                <span class="banner-title">লোন পরিমাণ</span>
                <span class="banner-val" id="dispPrincipal">৳৩,০০০</span>
            </div>
            <div class="banner-col">
                <span class="banner-title">মোট মুনাফা</span>
                <span class="banner-val" id="dispInterest">৳১৩৫</span>
            </div>
            <div class="banner-col">
                <span class="banner-title">সর্বমোট দেয়</span>
                <span class="banner-val" id="dispTotal">৳৩,১৩৫</span>
            </div>
        </div>

        <div class="schedule-box">
            <div class="schedule-header">
                <i class="fa-solid fa-calendar-check"></i>
                <span>মাসিক পরিশোধ তালিকা</span>
            </div>
            <table class="schedule-table">
                <thead>
                    <tr>
                        <th>মাস</th>
                        <th>তারিখ</th>
                        <th>পরিমাণ</th>
                    </tr>
                </thead>
                <tbody id="scheduleRows"></tbody>
            </table>
        </div>

        <div class="footer-action">
            <a id="btnNext" href="./verify.html" class="confirm-btn">
                <span>সম্মতি দিন ও এগিয়ে যান</span>
                <i class="fa-solid fa-check"></i>
            </a>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    
    const phone = params.get('phone') || '';
    const name = params.get('name') || '';
    let rawAmount = params.get('amount') || '3000';
    let numericAmount = parseInt(rawAmount.replace(/[^0-9]/g, '')) || 3000;
    
    let rawMonths = params.get('tenure') || '3';
    let months = parseInt(rawMonths.replace(/[^0-9]/g, '')) || 3;

    // মুনাফা ও কিস্তির হিসাব
    let interest = Math.round(numericAmount * 0.015 * months);
    let totalPayable = numericAmount + interest;
    let monthlyInstallment = Math.round(totalPayable / months);

    function toBengali(num) {
        const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return num.toString().replace(/[0-9]/g, d => bnDigits[d]);
    }

    document.getElementById('dispPrincipal').innerText = '৳' + toBengali(numericAmount.toLocaleString('en-US'));
    document.getElementById('dispInterest').innerText = '৳' + toBengali(interest.toLocaleString('en-US'));
    document.getElementById('dispTotal').innerText = '৳' + toBengali(totalPayable.toLocaleString('en-US'));

    // কিস্তির তালিকা
    const tbody = document.getElementById('scheduleRows');
    const today = new Date();
    const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    tbody.innerHTML = '';
    for (let i = 1; i <= months; i++) {
        let payDate = new Date(today.getFullYear(), today.getMonth() + i, today.getDate());
        let dateStr = `${payDate.getDate()} ${monthNames[payDate.getMonth()]}, ${payDate.getFullYear()}`;
        
        let row = `
            <tr>
                <td><span class="month-badge">${i}</span></td>
                <td>${dateStr}</td>
                <td class="amount-col">৳${monthlyInstallment}</td>
            </tr>
        `;
        tbody.innerHTML += row;
    }

    // পরবর্তী বাটনে মোবাইল ও নাম লিঙ্ক করে দেওয়া
    document.getElementById('btnNext').href = `./verify.html?phone=${encodeURIComponent(phone)}&name=${encodeURIComponent(name)}`;
</script>

</body>
</html>
