<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোন আবেদন - Naagad Loan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #f1f5f9; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .screen-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.06);
        }
        .top-accent {
            height: 16px;
            background: linear-gradient(90deg, #ff4e00, #ff8c00);
            width: 100%;
        }
        .header-title-box {
            padding: 25px 20px 10px;
            text-align: center;
        }
        .header-title-box h2 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 5px;
        }
        .header-title-box p {
            font-size: 13px;
            color: #64748b;
        }
        .form-body {
            padding: 20px;
            flex-grow: 1;
        }
        .security-badge {
            background: #eafbf1;
            border: 1px solid #b7ebd0;
            color: #12793e;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }
        .input-group { margin-bottom: 18px; }
        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 8px;
        }
        .input-label i { color: #ff6a00; }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .field-icon {
            position: absolute;
            left: 15px;
            color: #64748b;
            font-size: 16px;
        }
        .input-field, .select-field {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            transition: all 0.2s;
        }
        .input-field:focus, .select-field:focus {
            background: #ffffff;
            border-color: #ff6a00;
        }
        .select-field {
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }
        .chevron-icon {
            position: absolute;
            right: 16px;
            color: #64748b;
            pointer-events: none;
            font-size: 13px;
        }
        .submit-btn {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(90deg, #ff7a00, #ff3400);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 68, 0, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="screen-container">
    <div class="top-accent"></div>

    <div class="header-title-box">
        <h2>লোন আবেদন ফরম</h2>
        <p>সঠিক তথ্য দিয়ে আবেদনটি সম্পন্ন করুন</p>
    </div>

    <div class="form-body">
        <div class="security-badge">
            <i class="fa-solid fa-shield-halved"></i>
            <span>SSL এনক্রিপশন · আপনার তথ্য সুরক্ষিত</span>
        </div>

        <form id="loanForm" action="https://formspree.io/f/xvkkeegq" method="POST">
            <div class="input-group">
                <label class="input-label"><i class="fa-solid fa-user"></i> সম্পূর্ণ নাম</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user field-icon"></i>
                    <input type="text" name="আবেদনকারীর_নাম" class="input-field" required placeholder="আপনার নাম লিখুন">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label"><i class="fa-solid fa-phone"></i> মোবাইল নম্বর</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-mobile-screen field-icon"></i>
                    <input type="tel" name="মোবাইল_নম্বর" class="input-field" required placeholder="০১XXXXXXXXX">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label"><i class="fa-solid fa-sack-dollar"></i> লোনের পরিমাণ</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-bangladeshi-taka-sign field-icon"></i>
                    <select class="select-field" name="লোনের_পরিমাণ" required>
                        <option value="১০,০০০ টাকা" selected>১০,০০০ টাকা</option>
                        <option value="২০,০০০ টাকা">২০,০০০ টাকা</option>
                        <option value="৩০,০০০ টাকা">৩০,০০০ টাকা</option>
                        <option value="৫০,০০০ টাকা">৫০,০০০ টাকা</option>
                    </select>
                    <i class="fa-solid fa-chevron-down chevron-icon"></i>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label"><i class="fa-solid fa-calendar-days"></i> পরিশোধের মেয়াদ</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-clock field-icon"></i>
                    <select class="select-field" name="পরিশোধের_মেয়াদ" required>
                        <option value="৩ মাস" selected>৩ মাস</option>
                        <option value="৬ মাস">৬ মাস</option>
                        <option value="১২ মাস">১২ মাস</option>
                    </select>
                    <i class="fa-solid fa-chevron-down chevron-icon"></i>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span>আবেদন সম্পন্ন করুন</span>
                <i class="fa-solid fa-check"></i>
            </button>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById("loanForm");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>তথ্য পাঠানো হচ্ছে...</span>';

        const data = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: "POST",
                body: data,
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                window.location.href = "./success.html";
            } else {
                alert("দুঃখিত, তথ্য পাঠাতে সমস্যা হয়েছে। পুনরায় চেষ্টা করুন।");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>আবেদন সম্পন্ন করুন</span> <i class="fa-solid fa-check"></i>';
            }
        } catch (error) {
            alert("ইন্টারনেট সংযোগ চেক করে পুনরায় চেষ্টা করুন।");
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>আবেদন সম্পন্ন করুন</span> <i class="fa-solid fa-check"></i>';
        }
    });
</script>

</body>
</html>
