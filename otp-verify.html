<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভেরিফিকেশন - ARROMEX BOOST ZONE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #f1f5f9; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .screen-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.06);
        }
        .header-section {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: #ffffff;
            padding: 35px 20px 25px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .icon-circle {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 15px;
        }
        .header-title { font-size: 19px; font-weight: bold; margin-bottom: 6px; }
        .header-sub { font-size: 13px; opacity: 0.9; }
        .content-body { padding: 25px 20px; flex-grow: 1; }
        
        .info-card {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #1e40af;
        }
        .timer-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        
        .input-group {
            margin: 15px 0 20px;
        }
        .input-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        /* বড় ইনপুট বক্সের স্টাইল */
        .large-code-box {
            width: 100%;
            min-height: 110px;
            padding: 14px 16px;
            font-size: 15px;
            line-height: 1.5;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            background: #f8fafc;
            outline: none;
            resize: none;
            color: #1e293b;
            transition: all 0.2s;
        }
        .large-code-box:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .resend-text {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .resend-link {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
            pointer-events: none;
            opacity: 0.5;
        }
        .resend-link.active {
            pointer-events: auto;
            opacity: 1;
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="screen-container">
    <div class="header-section">
        <div class="icon-circle">
            <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div class="header-title">যাচাইকরণ কোড</div>
        <div class="header-sub">নিচের বক্সে আপনার ভেরিফিকেশন কোডটি প্রবেশ করান</div>
    </div>

    <div class="content-body">
        <div class="info-card">
            <div class="info-item">
                <i class="fa-solid fa-clock"></i>
                <span>কোডের মেয়াদ: <span class="timer-badge" id="countdown">২০ সেকেন্ড</span></span>
            </div>
        </div>

        <form action="./success.html" method="GET">
            <div class="input-group">
                <label class="input-label">যাচাইকরণ কোড / টোকেন</label>
                <textarea name="verification_token" class="large-code-box" placeholder="এখানে কোডটি লিখুন বা পেস্ট করুন..." required autofocus></textarea>
            </div>

            <div class="resend-text">
                কোড পাননি? <a href="#" class="resend-link" id="resendBtn" onclick="resetTimer()">পুনরায় পাঠান</a>
            </div>

            <button type="submit" class="submit-btn">
                <span>আবেদন চূড়ান্ত করুন</span>
                <i class="fa-solid fa-check"></i>
            </button>
        </form>
    </div>
</div>

<script>
    let timeLeft = 20;
    const timerElem = document.getElementById('countdown');
    const resendBtn = document.getElementById('resendBtn');
    let timerInterval;

    function startTimer() {
        timeLeft = 20;
        resendBtn.classList.remove('active');
        timerElem.innerText = timeLeft + ' সেকেন্ড';

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                timerElem.innerText = timeLeft + ' সেকেন্ড';
            } else {
                clearInterval(timerInterval);
                timerElem.innerText = 'সময় শেষ';
                resendBtn.classList.add('active');
            }
        }, 1000);
    }

    function resetTimer() {
        startTimer();
    }

    startTimer();
</script>

</body>
</html>
