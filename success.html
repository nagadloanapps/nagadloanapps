<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আবেদন সফল হয়েছে - ARROMEX BOOST ZONE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #f1f5f9; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .success-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: #eafbf1;
            color: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 20px;
        }
        h2 { font-size: 22px; color: #1e293b; margin-bottom: 8px; }
        p { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 25px; }
        .home-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="icon-circle">
        <i class="fa-solid fa-check"></i>
    </div>
    <h2>আবেদন সফল হয়েছে!</h2>
    <p>আপনার লোন আবেদনটি সফলভাবে গৃহীত হয়েছে। খুব শীঘ্রই আমাদের প্রতিনিধি আপনার দেওয়া মোবাইল নম্বরে যোগাযোগ করবেন।</p>
    <a href="./index.html" class="home-btn">হোমপেজে ফিরে যান</a>
</div>

</body>
</html>
